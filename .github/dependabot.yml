# Keeps Go modules and the GitHub Actions used by the workflows up to date,
# opening grouped weekly PRs that the CI / security gates then vet.
#
# Note: deps pinned via local `replace` directives in go.mod (crypto11,
# pkcs11-go) are not tracked here — only registry-resolved modules are.
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - go
    groups:
      go-modules:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"
