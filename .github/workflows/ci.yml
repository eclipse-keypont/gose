name: CI

# Build, vet and test the module. Replaces the legacy .travis.yml pipeline.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -gcflags=-l -short -race -coverprofile=coverage.out ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out

  hsm-integration:
    name: HSM integration (SoftHSMv2 PQC)
    # ubuntu-26.04 ships OpenSSL 3.5, which SoftHSMv2 needs for ML-KEM/ML-DSA.
    # ubuntu-24.04 ships OpenSSL 3.0.13 and cannot build the PQC module.
    runs-on: ubuntu-26.04
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Builds SoftHSMv2 main with ML-KEM/ML-DSA against the runner's OpenSSL
      # 3.5 and exports PKCS11_MODULE. The apt softhsm2 on ubuntu-24.04 is
      # 2.6.1: it advertises wrong HMAC key sizes and has no ML-KEM/ML-DSA.
      - name: Set up SoftHSMv2 (PQC)
        uses: ./.github/actions/setup-softhsmv2-pqc

      - name: Run HSM integration tests
        # TestMain bootstraps an ephemeral token via the PKCS#11 API when
        # PKCS11_MODULE is set — no softhsm2-util pre-init required.
        env:
          PKCS11_PIN: '1234'
        run: go test -count=1 -race -v ./hsm/...

  hsm-integration-softhsmv3:
    name: HSM integration (SoftHSMv3 PQC)
    runs-on: ubuntu-latest
    # SoftHSMv3's vendored pkcs11-provider needs OpenSSL 3.6, which no
    # GitHub-hosted runner image ships (ubuntu-26.04 has 3.5.5). archlinux:latest
    # ships OpenSSL 3.6.x with headers, so the module builds against a prebuilt
    # OpenSSL with no source build. The job runs inside the container.
    container:
      image: archlinux:latest
    steps:
      # actions/checkout runs inside the container and needs git; the
      # archlinux:latest base image does not ship it. Install git and the CA
      # bundle before checkout. The setup-softhsmv3-pqc action installs the
      # remaining build dependencies afterwards.
      - name: Bootstrap container prerequisites
        run: pacman -Syu --noconfirm --needed git ca-certificates

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Builds SoftHSMv3 (pqctoday-hsm) with ML-KEM/ML-DSA against the container's
      # OpenSSL 3.6 and exports PKCS11_MODULE. The hsm/ suite self-skips when
      # PKCS11_MODULE is unset, so this job is what actually exercises it.
      - name: Set up SoftHSMv3 (PQC)
        uses: ./.github/actions/setup-softhsmv3-pqc

      - name: Run HSM integration tests
        # TestMain bootstraps an ephemeral token via the PKCS#11 API when
        # PKCS11_MODULE is set — no softhsm2-util pre-init required.
        env:
          PKCS11_PIN: '1234'
        run: go test -count=1 -race -v ./hsm/...
