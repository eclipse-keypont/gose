name: Security Scan (gosec)

# Runs gosec (https://github.com/securego/gosec) — a static-analysis security
# scanner for Go code. Complements the govulncheck workflow (dependency CVEs) by
# flagging insecure code patterns in this module itself. Runs on PRs and weekly
# so newly added rules surface even without a code change.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '27 6 * * 1'
  workflow_dispatch:
  # Allows the Release pipeline to gate a tag on a passing security scan.
  workflow_call:

permissions:
  contents: read

jobs:
  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Pinned to gosec master (x/tools v0.52.0) instead of the v2.29.0 release:
      # v2.29.0 links x/tools v0.49.0, which cannot decode the go1.27.3 export
      # data (version 5 > maximum supported 4) and fails the scan. Move back to a
      # tagged release once one ships x/tools >= v0.50.0.
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@71577268350e1e0f2f1491de1ef53f1227b43c1f # master, x/tools v0.52.0

      - name: Run gosec
        run: gosec ./...
