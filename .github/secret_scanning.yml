# GitHub native secret scanning configuration.
#
# Secret scanning is enabled in the repository's Settings > Code security and
# runs on every push, on pull requests, and across the full git history. It is
# free for public repositories and requires no workflow or third-party action.
#
# This file only customises the scan; it does not enable it. See
# .github/SECRET_SCANNING.md for the one-time repository setting.
#
# Paths listed below are excluded from secret scanning. Keep this list as small
# as possible: every entry is a blind spot. Only add paths that are guaranteed
# to contain non-production, non-credential data.

paths-ignore:
  # Test fixtures and example code may embed throwaway keys, tokens, or
  # connection strings that are not real credentials.
  - '**/*_test.go'
  - 'examples/**'
